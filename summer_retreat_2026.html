<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2026 청소년 1부 하계수련회 안내</title>
  <style>
    :root {
      --primary: #2563eb;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text-main: #0f172a;
      --text-sub: #64748b;
      --border: #e2e8f0;
      --radius: 16px;
      --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05), 0 2px 4px -2px rgba(0, 0, 0, 0.05);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Noto Sans KR", sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px 16px;
    }

    .container {
      width: 100%;
      max-width: 760px;
    }

    /* 상단 네비게이션 */
    .nav-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .btn-back {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 8px 14px;
      background-color: #ffffff;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 0.9rem;
      font-weight: 600;
      color: var(--text-sub);
      cursor: pointer;
      text-decoration: none;
      transition: all 0.2s ease;
    }

    .btn-back:hover {
      background-color: #f1f5f9;
      color: var(--text-main);
    }

    /* 메인 알림 카드 */
    .notice-card {
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      box-shadow: var(--shadow);
      padding: 70px 24px;
      text-align: center;
    }

    .sub-badge {
      display: inline-block;
      padding: 6px 14px;
      background-color: #eff6ff;
      color: var(--primary);
      font-size: 0.95rem;
      font-weight: 700;
      border-radius: 30px;
      margin-bottom: 20px;
      letter-spacing: -0.2px;
    }

    .retreat-title {
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-sub);
      margin-bottom: 18px;
    }

    /* 크게 강조된 대체 문구 */
    .replace-text {
      font-size: 2.8rem;
      font-weight: 900;
      color: #1e3a8a;
      letter-spacing: -1px;
      line-height: 1.3;
      margin-bottom: 16px;
      word-break: keep-all;
    }

    .notice-desc {
      font-size: 1.05rem;
      color: var(--text-sub);
      line-height: 1.6;
      max-width: 520px;
      margin: 0 auto;
    }

    @media (max-width: 600px) {
      .replace-text {
        font-size: 2.1rem;
      }
      .notice-card {
        padding: 50px 20px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <!-- 상단 내비 -->
    <div class="nav-bar">
      <button class="btn-back" onclick="location.href='main.html'">← 사역 목록으로 돌아가기</button>
      <span style="font-size: 0.9rem; color: var(--text-sub); font-weight: 600;">2026 청소년 1부 사역 아카이브</span>
    </div>

    <!-- 안내 카드 -->
    <main class="notice-card">
      <div class="sub-badge">2026 하계 사역 안내</div>
      <div class="retreat-title">2026 청소년 1부 하계수련회</div>
      <h1 class="replace-text">선교대회로 대체됨.</h1>
      <p class="notice-desc">
        올해 하계수련회 일정은 전교인 <strong>선교대회</strong>로 전환되어 진행되었습니다.
      </p>
    </main>
  </div>
</body>
</html>
